server.port=8080

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vayro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# Security & JWT Configuration
# ===============================
app.jwt.secret=${JWT_SECRET:VayroEnterpriseSecureSigningKeyMustBe256BitsLongForHmacSha256Security123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Seed Configuration
app.admin.email=${ADMIN_EMAIL:admin@vayro.com}
app.admin.password=${ADMIN_PASSWORD:Admin@Vayro2026!}

# ===============================
# Springdoc / Swagger UI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
