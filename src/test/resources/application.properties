# Test Configuration - Isolated H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:vayro_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
app.jwt.secret=TestJwtSecretKeyForVayroTestingPurposesOnlyNeedsToBe256BitsMinimum12345
app.jwt.expiration-ms=3600000

# Test Admin Credentials
app.admin.email=admin@vayro.com
app.admin.password=AdminTestPass123!
